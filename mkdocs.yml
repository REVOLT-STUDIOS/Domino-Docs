site_name: Domino Documentation
theme:
  name: material
  color_mode: auto
  user_color_mode_toggle: true
extra:
  version:
    provider: mike
plugins:
  - mike:
      # These fields are all optional; the defaults are as below...
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ""
      canonical_version: null
      version_selector: true
      css_dir: css
      javascript_dir: js
nav:
  - Getting Started:
      - Introduction: index.md
      - Installation & Setup: setup.md
  - Core Concepts:
      - Concept: core-concept/concept.md
      - Brain and Behavior: core-concept/brain-behavior.md
      - Actions and Reactions: core-concept/actions-reactions.md
      - Effects: core-concept/effects.md
      - Meta Properties: core-concept/meta-properties.md
  - Architecture: architecture.md
  - API: api.md
  - Debugging: debugging.md
  - FAQ: faq.md
  - Example: example.md
  - Support: support.md
markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
